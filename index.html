<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>○○君はいつも全力</title>
<style>

* { box-sizing: border-box; }

body {
    margin: 0;
    background: #111;
    overflow: hidden;
    font-family: sans-serif;
}

.viewer {
    display: flex;
    width: 100vw;
    height: 100vh;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
}

.viewer::-webkit-scrollbar { display: none; }

.page {
    flex: 0 0 100%;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    scroll-snap-align: start;
    position: relative;
}

.page img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    background: #222;
    min-width: 40px;
    min-height: 40px;
    position: relative;
    z-index: 1;
}

/* スピナーは .loading のときだけ */
.page.loading::before {
    content: "";
    position: absolute;
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: rgba(255,255,255,0.6);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    pointer-events: none;
    z-index: 0;
}

@keyframes spin { to { transform: rotate(360deg); } }

.nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    font-size: 40px;
    color: white;
    background: rgba(0,0,0,0.5);
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    z-index: 10;
    transition: background 0.15s, opacity 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}
.nav:hover { background: rgba(0,0,0,0.8); }
.nav:disabled { opacity: 0.2; cursor: default; }
.prev { left: 10px; }
.next { right: 10px; }

.counter {
    position: fixed;
    bottom: 10px;
    right: 20px;
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 5px 10px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    z-index: 10;
    transition: background 0.15s;
}
.counter:hover { background: rgba(0,0,0,0.8); }

.jump-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 20;
    justify-content: center;
    align-items: center;
}
.jump-overlay.open { display: flex; }

.jump-panel {
    background: #1e1e1e;
    border: 1px solid #444;
    border-radius: 12px;
    padding: 20px;
    width: min(92vw, 420px);
    color: white;
}
.jump-panel h2 {
    margin: 0 0 16px;
    font-size: 15px;
    color: #aaa;
    font-weight: normal;
    letter-spacing: 0.05em;
}
.jump-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
    gap: 8px;
    max-height: 60vh;
    overflow-y: auto;
}
.jump-btn {
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 6px;
    color: white;
    font-size: 14px;
    padding: 10px 4px;
    cursor: pointer;
    text-align: center;
    transition: background 0.12s, border-color 0.12s;
    -webkit-tap-highlight-color: transparent;
}
.jump-btn:hover { background: #3a3a3a; }
.jump-btn.current {
    background: #fff;
    color: #111;
    border-color: #fff;
    font-weight: bold;
}
.jump-close {
    margin-top: 16px;
    width: 100%;
    background: transparent;
    border: 1px solid #555;
    color: #aaa;
    border-radius: 6px;
    padding: 10px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.12s;
}
.jump-close:hover { background: #2a2a2a; }

</style>
</head>
<body>

<button class="nav prev" id="prevBtn" onclick="prevPage()">‹</button>
<button class="nav next" id="nextBtn" onclick="nextPage()">›</button>

<div class="viewer" id="viewer"></div>

<div class="counter" id="counter" title="クリックでページ選択"></div>

<div class="jump-overlay" id="jumpOverlay">
    <div class="jump-panel">
        <h2>ページを選択</h2>
        <div class="jump-grid" id="jumpGrid"></div>
        <button class="jump-close" onclick="closeJump()">閉じる</button>
    </div>
</div>

<script>
// ── 画像リスト ──────────────────────────────────────────────
const BASE = "https://kuro516.github.io/cat4/";
const IMAGES = [
    "000.png","001.png","002.png","003.png","004.png",
    "005.png","006.png","006.1.png","006.2.png","007.png",
    "008.png","009.png","010.png","011.png","012.png",
    "013.png","014.png","015.png","016.png","017.png",
    "018.png","019.png","020.png","021.png","022.png",
    "023.png","024.png","025.png","026.png","027.png",
    "028.png","029.png","030.png","031.png","032.png",
    "033.png","034.png","035.png","036.png","037.png",

].map(f => BASE + f);

const TOTAL = IMAGES.length;

// ── DOM構築 ──────────────────────────────────────────────────
const viewer  = document.getElementById("viewer");
const counter = document.getElementById("counter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const jumpGrid = document.getElementById("jumpGrid");

IMAGES.forEach((src, i) => {
    const page = document.createElement("div");
    page.className = "page";
    page.dataset.src = src;

    const img = document.createElement("img");
    img.alt = `ページ ${i + 1}`;

    page.appendChild(img);
    viewer.appendChild(page);
});

for (let i = 0; i < TOTAL; i++) {
    const btn = document.createElement("button");
    btn.className = "jump-btn";
    btn.textContent = i + 1;
    btn.dataset.page = i + 1;
    btn.onclick = () => { goToPage(i + 1); closeJump(); };
    jumpGrid.appendChild(btn);
}

// ── 状態 ────────────────────────────────────────────────────
const pageEls = Array.from(viewer.querySelectorAll(".page"));
let currentPage  = 1;
let isScrolling  = false;
let scrollEndTimer = null;

// ── ページ復元 ───────────────────────────────────────────────
const savedPage = parseInt(localStorage.getItem("oooKunPage"));
if (savedPage >= 1 && savedPage <= TOTAL) {
    requestAnimationFrame(() => {
        viewer.scrollLeft = (savedPage - 1) * window.innerWidth;
        currentPage = savedPage;
        syncUI();
        prefetchAround(savedPage);
    });
} else {
    syncUI();
    prefetchAround(1);
}

// ── スクロール検出 ───────────────────────────────────────────
const supportsScrollend = "onscrollend" in window;

viewer.addEventListener("scroll", () => {
    if (!supportsScrollend) {
        clearTimeout(scrollEndTimer);
        scrollEndTimer = setTimeout(onScrollEnd, 120);
    }
});

if (supportsScrollend) {
    viewer.addEventListener("scrollend", onScrollEnd);
}

function onScrollEnd() {
    isScrolling = false;
    const page = Math.round(viewer.scrollLeft / window.innerWidth) + 1;
    if (page !== currentPage) {
        currentPage = page;
        syncUI();
        prefetchAround(page);
        localStorage.setItem("oooKunPage", page);
    }
}

// ── ページ移動 ───────────────────────────────────────────────
function nextPage() {
    if (isScrolling || currentPage >= TOTAL) return;
    isScrolling = true;
    viewer.scrollBy({ left: window.innerWidth, behavior: "smooth" });
}

function prevPage() {
    if (isScrolling || currentPage <= 1) return;
    isScrolling = true;
    viewer.scrollBy({ left: -window.innerWidth, behavior: "smooth" });
}

function goToPage(page) {
    if (page < 1 || page > TOTAL) return;
    isScrolling = true;
    // ジャンプ先を即座にロード開始してからスクロール
    prefetchAround(page);
    viewer.scrollTo({ left: (page - 1) * window.innerWidth, behavior: "smooth" });
}

// ── 画像ロード ───────────────────────────────────────────────
function loadImage(pageEl) {
    if (!pageEl || pageEl.dataset.loaded) return;
    const src = pageEl.dataset.src;
    if (!src) return;
    pageEl.dataset.loaded = "1";

    const img = pageEl.querySelector("img");
    pageEl.classList.add("loading");
    img.onload  = () => pageEl.classList.remove("loading");
    img.onerror = () => pageEl.classList.remove("loading");
    img.src = src;
}

// 現在ページ + 次の3枚を先読み
function prefetchAround(page) {
    loadImage(pageEls[page - 1]);   // 現在
    loadImage(pageEls[page]);       // 次+1
    loadImage(pageEls[page + 1]);   // 次+2
    loadImage(pageEls[page + 2]);   // 次+3
}

// ── UI同期 ───────────────────────────────────────────────────
function syncUI() {
    counter.textContent = `${currentPage} / ${TOTAL}`;
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= TOTAL;

    jumpGrid.querySelectorAll(".jump-btn").forEach(btn => {
        btn.classList.toggle("current",
            parseInt(btn.dataset.page) === currentPage);
    });
}

// ── ページジャンプ ───────────────────────────────────────────
counter.addEventListener("click", openJump);

function openJump() {
    document.getElementById("jumpOverlay").classList.add("open");
    const currentBtn = jumpGrid.querySelector(".current");
    if (currentBtn) currentBtn.scrollIntoView({ block: "nearest" });
}

function closeJump() {
    document.getElementById("jumpOverlay").classList.remove("open");
}

document.getElementById("jumpOverlay").addEventListener("click", (e) => {
    if (e.target === e.currentTarget) closeJump();
});

// ── キーボード ───────────────────────────────────────────────
document.addEventListener("keydown", (e) => {
    if (document.getElementById("jumpOverlay").classList.contains("open")) {
        if (e.key === "Escape") closeJump();
        return;
    }
    if (e.key === "ArrowRight") nextPage();
    if (e.key === "ArrowLeft")  prevPage();
});
</script>
</body>
</html>
