.viewer{
    display:flex;
    width:100vw;
    height:100vh;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
}

.page{
    flex:0 0 100%;
    width:100vw;
    height:100vh;

    justify-content:center;
    align-items:center;

}

.nav{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    font-size:40px;
    color:white;
    background:rgba(0,0,0,0.5);
    border:none;
    padding:10px 20px;
    cursor:pointer;
    z-index:10;
}

.prev{
    left:10px;
}

.next{
    right:10px;
}

.counter{
    position:fixed;
    bottom:10px;
    right:20px;
    color:white;
    background:rgba(0,0,0,0.5);
    padding:5px 10px;
    border-radius:10px;
}

<div class="counter" id="counter">
1 / 3
</div>

<script>

const viewer = document.getElementById("viewer");
const counter = document.getElementById("counter");

const total = document.querySelectorAll(".page").length;

function updateCounter(){
    const page =
        Math.round(viewer.scrollLeft / window.innerWidth) + 1;

    counter.textContent = `${page} / ${total}`;
}

function nextPage(){
    viewer.scrollBy({
        left:window.innerWidth,
        behavior:"smooth"
    });
}

function prevPage(){
    viewer.scrollBy({
        left:-window.innerWidth,
        behavior:"smooth"
    });
}

viewer.addEventListener("scroll", updateCounter);

document.addEventListener("keydown",(e)=>{

    if(e.key==="ArrowRight"){
        nextPage();
    }

    if(e.key==="ArrowLeft"){
        prevPage();
    }

});

</script>
